kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/ws", "/health", "/docs", "/redoc", "/openapi.json"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.run]
args = ["bash", "-c", "exec uv run --frozen python -m uvicorn app.main:app --app-dir artifacts/api-server --host 0.0.0.0 --port \"$PORT\""]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
ENVIRONMENT = "production"
DEBUG = "false"

[services.production.health.startup]
path = "/api/healthz"
